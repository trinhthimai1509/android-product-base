name: CI

# Validates Product Base itself — not a consumer. Runs the exact commands documented in
# README's "Verifying the Base itself" section. :demo:installDebug is intentionally not run here:
# it needs a connected device and is a manual check, not a CI one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: spotlessCheck, lint, test, assembleDebug, assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify
        run: ./gradlew spotlessCheck lint test assembleDebug assembleRelease --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
