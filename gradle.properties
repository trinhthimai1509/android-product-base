# Maven coordinates. Set now, published later (ARCHITECTURE_PLAN.md §8): products already
# reference artifact coordinates through composite-build substitution, so switching to real
# artifacts is a one-line change in the product rather than a rename here.
group=dev.sautao.productbase
version=0.1.0-SNAPSHOT

# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
